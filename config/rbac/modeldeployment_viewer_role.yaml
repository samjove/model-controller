# This rule is not used by the project model-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to ml.model-controller.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: model-controller
    app.kubernetes.io/managed-by: kustomize
  name: modeldeployment-viewer-role
rules:
- apiGroups:
  - ml.model-controller.com
  resources:
  - modeldeployments
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ml.model-controller.com
  resources:
  - modeldeployments/status
  verbs:
  - get
