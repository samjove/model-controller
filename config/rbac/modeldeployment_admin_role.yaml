# This rule is not used by the project model-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over ml.model-controller.com.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: model-controller
    app.kubernetes.io/managed-by: kustomize
  name: modeldeployment-admin-role
rules:
- apiGroups:
  - ml.model-controller.com
  resources:
  - modeldeployments
  verbs:
  - '*'
- apiGroups:
  - ml.model-controller.com
  resources:
  - modeldeployments/status
  verbs:
  - get
